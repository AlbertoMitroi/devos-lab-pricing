name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

env:
  FEED: https://nuget.pkg.github.com/AlbertoMitroi/index.json

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in Docker
        run: docker build --target test .

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack in Docker
        run: docker build --target packages --build-arg VERSION=${GITHUB_REF_NAME#v} --output type=local,dest=out .
      - name: Push to GitHub Packages
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls out
          docker run --rm -v "$PWD/out:/out" -e NUGET_API_KEY mcr.microsoft.com/dotnet/sdk:8.0 \
            sh -c 'dotnet nuget push "/out/*.nupkg" --source "$0" --api-key "$NUGET_API_KEY" --skip-duplicate' "$FEED"
